<div id="scroll-progress" [style.width.%]="progress"></div>

<nav [class.scrolled]="scrolled">
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark">SV</div>
      <div class="logo-text">
        <div class="name">SANTHOSH V</div>
        <div class="role">Angular Full Stack Dev</div>
      </div>
    </div>
    <div class="navlinks">
      <a *ngFor="let link of navLinks"
         [href]="link.href"
         [class.active]="activeSection === link.href.substring(1)">{{ link.label }}</a>

      <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode" (click)="toggleTheme()">

        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a class="nav-cta" href="mailto:rvsanthosh2001@gmail.com">Let's Talk →</a>
    </div>
